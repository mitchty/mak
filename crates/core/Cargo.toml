[package]
name = "common"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "common"

[dependencies]
humantime = "~2"
log = "~0.4"
memmap2 = "~0.9"
nix = { version = "~0.31", features = ["process", "signal"] }
thiserror = "~2"
tokio = { version = "~1", features = [
